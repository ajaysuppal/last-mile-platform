name: Spike
description: A time-boxed investigation that ends in a decision or prototype
title: "Spike: <question>"
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox (hours)
      placeholder: "4"
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria and output
      placeholder: ADR / doc / prototype branch and a go/no-go recommendation
    validations:
      required: true
